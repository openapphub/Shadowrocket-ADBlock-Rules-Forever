name: CI/CD and Maintenance

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "0 23 * * *"

  push:
    branches:
      - build
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  pull_request_target:
    branches:
      - build
    paths-ignore:
      - '**.md'
      - 'LICENSE'

  workflow_dispatch:

jobs:
  close-issues:
    name: Close Inactive Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: "This issue is stale because it has been open for 30 days with no activity."
          close-issue-message: "This issue was closed because it has been inactive for 14 days since being marked as stale."
          days-before-pr-stale: -1
          days-before-pr-close: -1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  build-and-release:
    name: Build and Release Rules
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Build Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
          ref: build
          path: build

      - name: Checkout Release Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release
          path: release

      - name: Build Rules
        run: |
          cd build || exit 1
          chmod +x factory/auto_build.sh
          ./factory/auto_build.sh
    
      # 准备发布文件
      - name: Prepare Release Files
        run: |
          cd build || exit 1
          
          # 仅复制必要的 .conf 文件到发布目录
          # 这一步确保只有 .conf 文件会被处理
          if ls *.conf 1> /dev/null 2>&1; then
            cp *.conf ../release/
          else
            echo "Warning: No .conf files found in build directory!"
          fi
          
          # 可选：如果你需要 figure、LICENSE 或 readme，取消下面注释
          # cp -r figure ../release/ 2>/dev/null || true
          # cp LICENSE ../release/ 2>/dev/null || true
          # cp readme.md ../release/ 2>/dev/null || true
    
      - name: Update lazy rules
        run: |
          cd release || exit 1
          rm -f lazy.conf lazy_group.conf
          curl -fLo lazy.conf https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf || echo "Failed to download lazy.conf"
          curl -fLo lazy_group.conf https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy_group.conf || echo "Failed to download lazy_group.conf"
    
      - name: Commit and Push to Release Branch
        run: |
          git config --global --add safe.directory /github/workspace/build
          git config --global --add safe.directory /github/workspace/release

          cd release || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 检查 release 分支是否存在
          if ! git show-ref --verify --quiet refs/heads/release; then
             echo "Release branch not found, initializing..."
             if [ -z "$(git ls-files)" ]; then
               git checkout --orphan release
               git commit --allow-empty -m "Init release branch"
             else
               git checkout --orphan release
               git add -A
               git commit -am "Init release branch"
             fi
          else
             echo "Release branch exists, resetting..."
             git checkout release
          fi
          
          # 清理工作目录
          git rm -rf . || true
          
          # 再次复制并确保只有 .conf 和特定文件存在
          cd ../build
          cp *.conf ../release/ 2>/dev/null || true
          cd ../release
          
          # 重新获取 lazy 规则
          rm -f lazy.conf lazy_group.conf
          curl -fLo lazy.conf https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy.conf || true
          curl -fLo lazy_group.conf https://raw.githubusercontent.com/LOWERTOP/Shadowrocket/main/lazy_group.conf || true

          # 添加所有变更
          git add -A
          
          # 检查是否有变更
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -am "Nightly build @ $(date +'%Y-%m-%d %H:%M:%S')"
            git push -f origin release
          fi

      - name: Create GitHub Release
        if: github.event_name == 'schedule'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ github.run_number }}
          name: Nightly Build ${{ github.run_number }}
          body: |
            Automated nightly release.
            **Changes:**
            - Updated rules from build branch.
            - Synced lazy rules.
          # 严格匹配 release 目录下的 .conf 文件
          files: release/*.conf
          prerelease: true
          # 如果文件找不到会导致失败，调试阶段可以先设为 false
          fail_on_unmatched_files: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
